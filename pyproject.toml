[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "onebit-llm"
version = "0.1.0"
description = "A small Korean BitNet b1.58 continuation demo for a school presentation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "huggingface-hub>=0.27,<2",
  "numpy>=1.26,<3",
  "pyarrow>=18,<24",
  "PyYAML>=6,<7",
  "tokenizers>=0.21,<1",
  "torch>=2.4,<3",
]

[project.optional-dependencies]
app = ["gradio>=5,<7"]
dev = ["pytest>=8,<10"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
