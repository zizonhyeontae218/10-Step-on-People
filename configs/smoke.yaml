project:
  name: 10-step-on-people

data:
  tokens_path: data/processed/tokens.npy
  splits_path: data/processed/splits.npz
  tokenizer_path: data/tokenizer/tokenizer.json
  context_length: 32
  pad_token_id: 0

model:
  vocab_size: 32000
  context_length: 32
  hidden_size: 64
  num_layers: 2
  num_heads: 4
  ffn_size: 128
  dropout: 0.0

train:
  seed: 42
  micro_batch_size: 2
  gradient_accumulation: 1
  max_steps: 10
  max_minutes_per_model: 5
  learning_rate: 0.0003
  min_learning_rate: 0.00003
  warmup_steps: 2
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  eval_interval: 5
  eval_batches: 2
  log_interval: 1
  num_workers: 0
  output_dir: artifacts/smoke
