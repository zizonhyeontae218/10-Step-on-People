project:
  name: 10-step-on-people

data:
  tokens_path: data/processed/tokens.npy
  splits_path: data/processed/splits.npz
  tokenizer_path: data/tokenizer/tokenizer.json
  context_length: 128
  pad_token_id: 0

model:
  vocab_size: 32000
  context_length: 128
  hidden_size: 256
  num_layers: 4
  num_heads: 8
  ffn_size: 768
  dropout: 0.1

train:
  seed: 42
  micro_batch_size: 16
  gradient_accumulation: 2
  max_steps: 1500
  max_minutes_per_model: 55
  learning_rate: 0.0003
  min_learning_rate: 0.00003
  warmup_steps: 150
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  eval_interval: 100
  eval_batches: 25
  log_interval: 10
  num_workers: 0
  output_dir: artifacts
