project:
  name: 9-step-on-people

data:
  tokens_path: data/9-step-on-people/processed/tokens.npy
  splits_path: data/9-step-on-people/processed/splits.npz
  tokenizer_path: data/9-step-on-people/tokenizer/tokenizer.json
  context_length: 128
  pad_token_id: 0

model:
  vocab_size: 32000
  context_length: 128
  hidden_size: 256
  num_layers: 4
  num_heads: 8
  ffn_size: 768
  dropout: 0.1

train:
  seed: 42
  micro_batch_size: 16
  gradient_accumulation: 2
  max_steps: 8000
  max_minutes_per_model: 150
  learning_rate: 0.0003
  min_learning_rate: 0.00003
  warmup_steps: 300
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  eval_interval: 250
  eval_batches: 25
  log_interval: 25
  num_workers: 0
  output_dir: artifacts/9-step-on-people
